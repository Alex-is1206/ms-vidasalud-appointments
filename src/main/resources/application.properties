spring.application.name=ms-vidasalud-appointments

server.port=8081

# ---- Oracle ----
# URL y usuario tienen valor por defecto para desarrollo local (Oracle en Docker).
# En la nube se reemplazan con las variables de entorno DB_URL y DB_USERNAME.
# La contraseña nunca se versiona: siempre viene de DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:vidasalud}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- RabbitMQ (colas de trabajo, sin cambios desde EP3) ----
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:vidasalud}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# ---- Nombres centralizados de la topologia de RabbitMQ (Indicador 1 EP3) ----
vidasalud.rabbit.exchange-topic=cmd.topic
vidasalud.rabbit.exchange-direct=cmd.direct
vidasalud.rabbit.exchange-dlx=cmd.dead.dlx
vidasalud.rabbit.cola-notificaciones=vidasalud.notificaciones
vidasalud.rabbit.cola-tickets=vidasalud.tickets
vidasalud.rabbit.cola-auditoria=vidasalud.auditoria

# ---- Kafka (streaming de eventos, EP5) ----
# Desde el PC se usan los listeners externos (localhost:9092-9094).
# En Docker, KAFKA_BOOTSTRAP apunta a kafka1:29092,kafka2:29092,kafka3:29092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}

# Nombres centralizados de Kafka: identicos en todos los microservicios.
# Las particiones, replicas y retencion de cada topico las define ms-vidasalud-kafka-admin.
vidasalud.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
vidasalud.kafka.client-id=ms-vidasalud-appointments
vidasalud.kafka.topico-atenciones=vidasalud.atenciones.eventos
vidasalud.kafka.topico-boxes=vidasalud.boxes.estado
